isual\" aria-labelledby=\"welcome-title\">\u003ch1 id=\"welcome-title\">¿Qué problema ves?\u003c/h1>\u003cp class=\"welcome-subtitle\">Mirá, elegí y jugá a tu ritmo.\u003c/p>\u003cdiv class=\"welcome-steps\">\u003cdiv class=\"welcome-step first-step\">\u003cdiv class=\"welcome-step-heading\">\u003cspan class=\"step-number\" aria-hidden=\"true\">1\u003c/span>\u003ch2>Mirá la imagen\u003c/h2>\u003c/div>\u003cdiv class=\"welcome-example\">\u003cdiv id=\"example-art\" aria-hidden=\"true\">\u003c/div>\u003cspan>Foco roto\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"welcome-step second-step\">\u003cdiv class=\"welcome-step-heading\">\u003cspan class=\"step-number\" aria-hidden=\"true\">2\u003c/span>\u003ch2>Tocá el tipo de problema\u003c/h2>\u003c/div>\u003cdiv id=\"welcome-categories\" class=\"welcome-categories\" aria-label=\"Ejemplo: un foco roto corresponde a Electricidad\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"welcome-badges\">\u003cspan>\u003csvg viewBox=\"0 0 32 32\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003ccircle cx=\"16\" cy=\"16\" r=\"12\"/>\u003cpath d=\"M16 8v8l6 4\"/>\u003c/svg>\u003cstrong>Sin reloj\u003c/strong>\u003c/span>\u003cspan>\u003csvg viewBox=\"0 0 32 32\" aria-hidden=\"true\" fill=\"currentColor\">\u003cpath d=\"M16 28 4 16C-5 4 9-3 16 7 23-3 37 4 28 16Z\"/>\u003c/svg>\u003cstrong>Sin perder vidas\u003c/strong>\u003c/span>\u003c/div>\u003cp class=\"welcome-tip\">Si te equivocás, probás otra vez.\u003cbr>También podés pedir una pista.\u003c/p>\u003cbutton id=\"start\" class=\"primary start\">Empezar a jugar →\u003c/button>\u003cbutton class=\"quiet\" data-help>Ver cómo se juega\u003c/button>\u003c/section>\n\u003csection id=\"game\" hidden aria-labelledby=\"question\">\u003cdiv class=\"topline\">\u003cdiv>\u003cdiv id=\"progress-label\" class=\"progress-label\">\u003c/div>\u003cdiv id=\"dots\" class=\"dots\" aria-hidden=\"true\">\u003c/div>\u003c/div>\u003cbutton id=\"home\" class=\"quiet\">Volver al inicio\u003c/button>\u003c/div>\u003cdiv class=\"play-layout\">\u003carticle class=\"problem\">\u003cdiv id=\"art\" class=\"art\">\u003c/div>\u003ch2 id=\"problem-title\">\u003c/h2>\u003cbutton id=\"listen\" class=\"listen\">◖)) Escuchar el problema\u003c/button>\u003cp id=\"audio-status\" class=\"audio-status\" role=\"status\">\u003c/p>\u003c/article>\u003cdiv class=\"choices\">\u003ch2 id=\"question\" tabindex=\"-1\">¿Qué tipo de problema es?\u003c/h2>\u003cp class=\"instruction\">Tocá una de estas cuatro opciones.\u003c/p>\u003cdiv id=\"options\" class=\"options\">\u003c/div>\u003cdiv class=\"help-row\">\u003cbutton id=\"hint\" class=\"secondary\">Dame una pista\u003c/button>\u003cbutton class=\"quiet\" data-help>Cómo jugar\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"feedback\" class=\"feedback\" hidden>\u003cp id=\"message\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\u003cdiv id=\"auto-progress\" class=\"auto-progress\" aria-hidden=\"true\" hidden>\u003cspan>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"footer\">Mirá con calma. La imagen espera por vos.\u003c/p>\u003c/section>\n\u003csection id=\"finish\" class=\"finish\" hidden aria-labelledby=\"finish-title\">\u003cdiv id=\"medal\" class=\"medal\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"eyebrow\">¡PARTIDA COMPLETA!\u003c/div>\u003ch1 id=\"finish-title\" tabindex=\"-1\">¡Qué bien! Juntos cuidamos más.\u003c/h1>\u003cp>Ya reconocés problemas que podemos reportar.\u003c/p>\u003cdiv class=\"summary\">\u003cb>8 de 8 situaciones completadas\u003c/b>\u003cp>Agua, electricidad, humedad y roturas.\u003cbr>Cada aviso ayuda a cuidar el edificio.\u003c/p>\u003c/div>\u003cdiv class=\"finish-actions\">\u003cbutton id=\"again\" class=\"primary\">Volver a jugar ↻\u003c/button>\u003cbutton id=\"finish-home\" class=\"secondary\">Volver al inicio\u003c/button>\u003c/div>\u003cp class=\"calm\">Este es un juego de práctica. No envía reportes reales.\u003c/p>\u003c/section>\n\u003c/main>\n\u003cdialog id=\"help\" aria-labelledby=\"help-title\">\u003ch2 id=\"help-title\">Es muy fácil jugar\u003c/h2>\u003col>\u003cli>Mirá la imagen y su frase corta.\u003c/li>\u003cli>Tocá el tipo de problema: agua, electricidad, humedad o roturas.\u003c/li>\u003cli>Si acertás, verás «¡Muy bien!» y aparecerá otra imagen automáticamente.\u003c/li>\u003c/ol>\u003cp>Podés pedir una pista. No hay límite de tiempo y podés volver a intentar.\u003c/p>\u003cbutton id=\"close-help\" class=\"primary\">Entendido, seguir\u003c/button>\u003c/dialog>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst svg=(body,label='')=>`\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" ${label?`role=\"img\" aria-label=\"${label}\"`:'aria-hidden=\"true\"'} fill=\"none\" stroke=\"#274863\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${body}\u003c/svg>`;\nconst drop=(x,y,s=1)=>`\u003cpath transform=\"translate(${x} ${y}) scale(${s})\" d=\"M0-23C-7-12-18 0-18 10a18 18 0 0 0 36 0C18 0 7-12 0-23Z\" fill=\"#68bce6\" stroke=\"#216aa1\" stroke-width=\"3\"/>`;\nconst bulb=svg('\u003cellipse cx=\"160\" cy=\"208\" rx=\"60\" ry=\"8\" fill=\"#d9e5eb\" stroke=\"none\"/>\u003cpath d=\"M133 151c0-24-29-36-29-74a56 56 0 0 1 112 0c0 38-29 50-29 74Z\" fill=\"#ffe2a1\"/>\u003cpath d=\"m162 28-12 35 24 15-24 29 11 26\" stroke=\"#996b32\" stroke-width=\"5\"/>\u003cpath d=\"M134 158h52v23a26 26 0 0 1-52 0Z\" fill=\"#a3b8c9\"/>\u003cpath d=\"M138 167h44m-44 12h44\"/>\u003cpath d=\"m82 40-16-13m172 13 16-13M76 93H54m190 0h22\" stroke=\"#dfa42a\"/>','Un foco con el vidrio agrietado');\nconst faucet=svg('\u003cellipse cx=\"162\" cy=\"216\" rx=\"102\" ry=\"9\" fill=\"#d9e5eb\" stroke=\"none\"/>\u003cpath d=\"M68 185V89h93V65h42v24h20a42 42 0 0 1 42 42v13h-42v-13h-62v54Z\" fill=\"#b6cfdf\"/>\u003cpath d=\"M55 185h122v19H55Z\" fill=\"#8baac0\"/>\u003cpath d=\"M182 64V39m-32 0h64\" stroke-width=\"10\"/>'+drop(243,177,.75),'Una canilla que pierde gotas de agua');\nconst socket=svg('\u003crect x=\"87\" y=\"27\" width=\"146\" height=\"179\" rx=\"18\" fill=\"#fff\"/>\u003ccircle cx=\"160\" cy=\"115\" r=\"47\" fill=\"#dbe7ef\"/>\u003cpath d=\"M145 104v19m30-19v19m-17 14h4\"/>\u003cpath d=\"m200 37-21 29 22 10-18 21\" stroke=\"#bd6849\"/>\u003cpath d=\"m63 83-17-14m209 66 21 9m-53 46 14 17\" stroke=\"#e4a632\"/>','Un enchufe con la tapa rota');\nconst lamp=svg('\u003cpath d=\"M160 19v29\"/>\u003cpath d=\"m114 48-34 77h160l-34-77Z\" fill=\"#88b5d5\"/>\u003cpath d=\"M132 125v19a28 28 0 0 0 56 0v-19\" fill=\"#c0ccd5\"/>\u003cpath d=\"m146 133 26 27m0-27-26 27\" stroke=\"#697c8c\"/>\u003cellipse cx=\"160\" cy=\"210\" rx=\"90\" ry=\"8\" fill=\"#d9e5eb\" stroke=\"none\"/>','Una lámpara apagada');\nconst damp=svg('\u003crect x=\"45\" y=\"28\" width=\"230\" height=\"185\" rx=\"7\" fill=\"#fff4db\"/>\u003cpath d=\"M48 155c13-32 29-9 43-26s21-25 40-12 19-11 40-3 23 35 41 24 33 11 59 30v42H48Z\" fill=\"#91b8ab\" stroke=\"none\"/>\u003cpath d=\"M64 177h17m20-22h18m18 35h25m30-31h19m16 35h18\" stroke=\"#537e73\"/>'+drop(161,69,.75),'Una pared con manchas de humedad');\nconst ceiling=svg('\u003cpath d=\"M40 207V49h240v158\" fill=\"#fff4db\"/>\u003cpath d=\"M40 49h240v32H40Z\" fill=\"#afc9c0\"/>\u003cpath d=\"M94 51c0 31 23 15 23 43s28 19 28-1 20-12 20-42\" fill=\"#80a89b\" stroke=\"none\"/>'+drop(128,130,.7)+drop(128,178,.5)+'\u003cpath d=\"M205 148h43v59h-43Zm-27 59h90\" fill=\"#bfd6e5\"/>','Un techo con humedad y gotas');\nconst door=svg('\u003cpath d=\"M74 210V26h172v184\" fill=\"#c4d9e7\"/>\u003cpath d=\"M94 210V44h128v166\" fill=\"#e9bd8f\"/>\u003cpath d=\"m128 67 20 35-19 26 26 19-11 28\" stroke=\"#996036\"/>\u003ccircle cx=\"194\" cy=\"128\" r=\"7\" fill=\"#446782\"/>\u003cpath d=\"M54 213h212\"/>','Una puerta de madera agrietada');\nconst windowArt=svg('\u003crect x=\"63\" y=\"29\" width=\"194\" height=\"179\" rx=\"5\" fill=\"#fff\"/>\u003cpath d=\"M78 44h164v149H78Z\" fill=\"#bde2f1\"/>\u003cpath d=\"M160 44v149M78 118h164\" stroke=\"#688ca6\"/>\u003cpath d=\"m219 64-31 23 17 28-28 26 19 27m-8-81-13-17m30 45 25 7\" stroke=\"#416886\"/>\u003cpath d=\"M51 209h218\"/>','Una ventana con el vidrio quebrado');\nconst cats=[{id:'agua',name:'Agua',tone:'#1765a1',tint:'#e5f3ff',icon:'\u003cpath d=\"M24 5C18 15 10 23 10 31a14 14 0 0 0 28 0C38 23 30 15 24 5Z\" fill=\"currentColor\"/>'},{id:'electricidad',name:'Electricidad',tone:'#956100',tint:'#fff1ca',icon:'\u003cpath d=\"m27 3-17 25h12l-3 17 19-27H26Z\" fill=\"currentColor\"/>'},{id:'humedad',name:'Humedad',tone:'#26765c',tint:'#e5f3ed',icon:'\u003cpath d=\"M24 5C18 15 10 23 10 31a14 14 0 0 0 28 0C38 23 30 15 24 5Z\" fill=\"currentColor\"/>\u003cpath d=\"M23 35h9M19 29h12\" stroke=\"white\" stroke-width=\"3\"/>'},{id:'roturas',name:'Roturas',tone:'#b54935',tint:'#fdece6',icon:'\u003cpath d=\"M31 6a11 11 0 0 0-14 14L6 32a6 6 0 0 0 9 9l12-13a11 11 0 0 0 15-13l-9 8-7-7Z\" fill=\"currentColor\"/>'}];\nconst items=[{title:'Foco roto',cat:'electricidad',art:bulb,hint:'El foco sirve para dar luz.',why:'Los focos y las luces van en Electricidad.'},{title:'Canilla rota',cat:'agua',art:faucet,hint:'Mirá las gotas que salen de la canilla.',why:'Una canilla que pierde agua va en Agua.'},{title:'Enchufe roto',cat:'electricidad',art:socket,hint:'El enchufe conecta los aparatos a la electricidad.',why:'Los enchufes van en Electricidad. No los toques si están rotos.'},{title:'Luz apagada',cat:'electricidad',art:lamp,hint:'Esta lámpara debería dar luz.',why:'Una luz que no funciona va en Electricidad.'},{title:'Pared húmeda',cat:'humedad',art:damp,hint:'La pared tiene una mancha de humedad.',why:'Las manchas de humedad van en Humedad.'},{title:'Techo húmedo',cat:'humedad',art:ceiling,hint:'El techo tiene una mancha húmeda y gotas.',why:'Un techo con humedad va en Humedad.'},{title:'Puerta rota',cat:'roturas',art:door,hint:'La madera de la puerta está quebrada.',why:'Las puertas dañadas van en Roturas.'},{title:'Vidrio roto',cat:'roturas',art:windowArt,hint:'Mirá la grieta en el vidrio de la ventana.',why:'Los vidrios quebrados van en Roturas.'}];\n// Dos ejemplos de agua: se sustituye una luz por un caño para equilibrar las categorías.\nitems[3]={title:'Caño con pérdida',cat:'agua',art:svg('\u003cpath d=\"M43 54h120v55h109v57H136a30 30 0 0 1-30-30v-25H43Z\" fill=\"#afc8da\"/>\u003cpath d=\"M61 48v68m188-13v68\"/>\u003cpath d=\"m193 111-12 19 17 9-11 22\" stroke=\"#4a718d\"/>'+drop(189,196,.65),'Un caño agrietado que pierde agua'),hint:'Del caño están cayendo gotas de agua.',why:'Los caños que pierden agua van en Agua.'};\n$('example-art').innerHTML=bulb;\n$('medal').innerHTML=svg('\u003cpath d=\"m105 130-15 84 70-28 70 28-15-84\" fill=\"#bdd9ef\"/>\u003ccircle cx=\"160\" cy=\"92\" r=\"76\" fill=\"#ffe5a0\" stroke=\"#b58931\"/>\u003ccircle cx=\"160\" cy=\"92\" r=\"57\" stroke=\"#d0a248\"/>\u003cpath d=\"m127 92 23 23 47-50\" stroke=\"#317453\" stroke-width=\"13\"/>');\nfunction categoryIcon(c){return `\u003cspan class=\"icon\">\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\">${c.icon}\u003c/svg>\u003c/span>`}\nfunction categoryColors(c){return `--tone:${c.tone};--tint:${c.tint}`}\n$('options').innerHTML=cats.map((c,i)=>`\u003cbutton class=\"option\" data-cat=\"${c.id}\" style=\"${categoryColors(c)}\">${categoryIcon(c)}${c.name}\u003c/button>`).join('');\n$('welcome-categories').innerHTML=cats.map(c=>`\u003cdiv class=\"welcome-category ${c.id==='electricidad'?'example-selected':''}\" style=\"${categoryColors(c)}\">${categoryIcon(c)}\u003cspan>${c.name}\u003c/span>\u003c/div>`).join('');\nlet deck=[],index=0,answered=false,playing=false,helpOpener=null,advanceTimer=null;\nconst ADVANCE_DELAY=2000;\nfunction cancelAdvance(){clearTimeout(advanceTimer);advanceTimer=null;$('auto-progress').classList.remove('filling')}\nfunction scheduleAdvance(){cancelAdvance();if(playing&&answered&&!$('help').open){void $('auto-progress').offsetWidth;$('auto-progress').classList.add('filling');advanceTimer=setTimeout(advance,ADVANCE_DELAY)}}\nfunction advance(){cancelAdvance();if(!playing||!answered)return;if(index\u003c7){index++;render()}else{playing=false;showScreen('finish');$('finish-title').focus()}}\nfunction stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}\nfunction showScreen(id){cancelAdvance();stopSpeech();['welcome','game','finish'].forEach(s=>$(s).hidden=s!==id)}\nfunction start(){deck=[items[0],items[1],...shuffle(items.slice(2))];index=0;playing=true;showScreen('game');render()}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction render(){cancelAdvance();stopSpeech();answered=false;const item=deck[index];$('problem-title').textContent=item.title;$('art').innerHTML=item.art;$('progress-label').textContent=`Imagen ${index+1} de 8`;$('dots').innerHTML=deck.map((_,i)=>`\u003cspan class=\"dot ${i\u003cindex?'done':i===index?'current':''}\">\u003c/span>`).join('');$('feedback').hidden=true;$('feedback').className='feedback';$('message').textContent='';$('auto-progress').hidden=true;$('hint').disabled=false;$('audio-status').textContent='';document.querySelectorAll('.option').forEach(b=>{b.disabled=false;b.classList.remove('correct','hint','tried');b.removeAttribute('aria-describedby')});$('question').focus()}\nfunction feedback(title,text,success=false){$('feedback').hidden=false;$('feedback').className='feedback'+(success?' success':'');$('message').replaceChildren();const strong=document.createElement('strong');strong.textContent=title;$('message').append(strong,document.createTextNode(text))}\nfunction choose(button){if(!playing||answered)return;const item=deck[index];if(button.dataset.cat===item.cat){answered=true;button.classList.remove('hint');button.classList.add('correct');document.querySelectorAll('.option').forEach(b=>b.disabled=true);$('hint').disabled=true;feedback('¡Muy bien! ✓',item.why,true);$('auto-progress').hidden=false;scheduleAdvance()}else{button.classList.add('tried');feedback('Probemos otra opción.',item.hint+' Podés pedir una pista.');button.setAttribute('aria-describedby','message')}}\ndocument.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>choose(b)));\n$('hint').addEventListener('click',()=>{if(!playing||answered)return;const item=deck[index],cat=cats.find(c=>c.id===item.cat);feedback('Una pista para vos',item.hint+' Tocá «'+cat.name+'».');document.querySelector(`[data-cat=\"${item.cat}\"]`).classList.add('hint')});\nfunction home(){playing=false;showScreen('welcome');$('start').focus()}\n$('start').addEventListener('click',start);$('again').addEventListener('click',start);$('home').addEventListener('click',home);$('finish-home').addEventListener('click',home);\ndocument.querySelectorAll('[data-help]').forEach(b=>b.addEventListener('click',()=>{helpOpener=b;cancelAdvance();stopSpeech();$('help').showModal()}));$('close-help').addEventListener('click',()=>$('help').close());$('help').addEventListener('close',()=>{if(helpOpener)helpOpener.focus();scheduleAdvance()});\n$('listen').addEventListener('click',()=>{if(!playing)return;if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){$('audio-status').textContent='En este navegador no hay lectura en voz alta. Podés leer la frase debajo de la imagen.';return}stopSpeech();const item=deck[index];const u=new SpeechSynthesisUtterance(item.title+'. ¿Qué tipo de problema es? Agua, electricidad, humedad o roturas.');u.lang='es-UY';u.rate=.85;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang.startsWith('es'));if(v)u.voice=v;u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')$('audio-status').textContent='No se pudo reproducir la voz. Podés leer la frase debajo de la imagen.'};window.speechSynthesis.speak(u)});\n\u003c/script>\n\u003cscript>\n(function(){\nlet pending=false;\nfunction resize(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;parent.postMessage({type:'game-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*')})}\nnew ResizeObserver(resize).observe(document.body);\nwindow.addEventListener('load',resize);\nresize();\n})();\n\u003c/script>\u003c/body>\n\u003c/html>\n", "hard": "\u003c!doctype html>\n\u003chtml lang=\"es-UY\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Edificios sin problemas · Desafío SIRED\u003c/title>\n\u003cstyle>\n:root{--ink:#172e4b;--muted:#4b6177;--blue:#175ba5;--cream:#faf8f2;--line:#d5e0e8;--green:#236c48}\n*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.5}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #172e4b;outline-offset:5px}button:disabled{cursor:default}button:hover:not(:disabled){filter:brightness(.96)}[hidden]{display:none!important}header{background:#fff;border-bottom:1px solid var(--line)}.bar{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 28px}.brand{display:flex;gap:14px;align-items:center;font-weight:bold;font-size:23px;line-height:1.2}.brand svg{width:46px;height:46px;color:var(--blue)}.brand small{display:block;font-size:15px;font-weight:normal;color:var(--muted);margin-top:5px}.pill{background:#eef5fa;color:#315775;border-radius:30px;padding:8px 16px;font-size:17px;white-space:nowrap}main{max-width:1060px;margin:auto;padding:28px 28px 36px}.intro{text-align:center;max-width:800px;margin:auto}.eyebrow{font-size:17px;font-weight:bold;letter-spacing:1px;color:var(--blue);margin:0 0 10px}h1{font-size:clamp(32px,4.2vw,48px);line-height:1.15;margin:0 0 15px;letter-spacing:-1px}p{margin:10px 0 20px}.intro>p{color:var(--muted);font-size:23px}.hero-art{width:100%;height:210px;margin:4px auto 16px}.steps{display:grid;grid-template-columns:1f es{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:22px 0 12px}.welcome-badges>span{display:flex;align-items:center;gap:10px;padding:11px 19px;border-radius:14px;background:#e7f4ec;color:var(--ink);font-size:20px}.welcome-badges svg{width:30px;height:30px;color:var(--green)}.welcome-visual .welcome-tip{font-size:20px;color:var(--muted);margin:8px 0 20px}.welcome-visual .start{width:100%;max-width:780px}.welcome-visual .record{margin:14px 0 3px;font-size:16px}.welcome-visual .quiet{font-size:18px;color:var(--blue)}\n@media(max-width:700px){.welcome-visual{padding-top:8px}.welcome-visual h1{font-size:34px}.welcome-visual .welcome-subtitle{font-size:21px;margin-bottom:20px}.welcome-step{padding:16px;border-radius:18px}.welcome-step-heading{gap:10px}.step-number{width:39px;height:39px;font-size:24px}.welcome-step h2{font-size:22px}.welcome-example #example-art{width:110px;height:96px}.welcome-example{font-size:14px}.first-step{gap:10px}.welcome-categories{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}.welcome-category{flex-direction:row;min-height:68px;gap:7px;font-size:16px;padding:10px 5px}.welcome-category .icon{width:32px;height:32px}.welcome-category .icon svg{width:30px;height:30px}.welcome-badges{gap:10px;margin:18px 0 10px}.welcome-badges>span{font-size:17px;padding:9px 12px;gap:7px}.welcome-badges svg{width:24px;height:24px}.welcome-visual .welcome-tip{font-size:17px;margin-bottom:16px}.welcome-steps{gap:12px}}\n@media(max-width:370px){.first-step .welcome-step-heading{flex-direction:column;align-items:flex-start;gap:6px}.first-step h2{font-size:20px}.welcome-category{font-size:15px}.welcome-category .icon{width:27px;height:27px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cmain>\n\u003csection id=\"welcome\" class=\"intro welcome-visual\" aria-labelledby=\"welcome-title\">\u003ch1 id=\"welcome-title\">¿Qué problema ves?\u003c/h1>\u003cp class=\"welcome-subtitle\">Mirá, elegí y sumá puntos.\u003c/p>\u003cdiv class=\"welcome-steps\">\u003cdiv class=\"welcome-step first-step\">\u003cdiv class=\"welcome-step-heading\">\u003cspan class=\"step-number\" aria-hidden=\"true\">1\u003c/span>\u003ch2>Mirá la imagen\u003c/h2>\u003c/div>\u003cdiv class=\"welcome-example\">\u003cdiv id=\"example-art\" aria-hidden=\"true\">\u003c/div>\u003cspan>Foco roto\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"welcome-step second-step\">\u003cdiv class=\"welcome-step-heading\">\u003cspan class=\"step-number\" aria-hidden=\"true\">2\u003c/span>\u003ch2>Tocá el tipo de problema\u003c/h2>\u003c/div>\u003cdiv id=\"welcome-categories\" class=\"welcome-categories\" aria-label=\"Ejemplo: un foco roto corresponde a Electricidad\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"welcome-badges\">\u003cspan>\u003csvg viewBox=\"0 0 32 32\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003ccircle cx=\"16\" cy=\"16\" r=\"12\"/>\u003cpath d=\"M16 8v8l6 4\"/>\u003c/svg>\u003cstrong>60 segundos\u003c/strong>\u003c/span>\u003cspan>\u003csvg viewBox=\"0 0 32 32\" aria-hidden=\"true\" fill=\"currentColor\">\u003cpath d=\"M16 28 4 16C-5 4 9-3 16 7 23-3 37 4 28 16Z\"/>\u003c/svg>\u003cstrong>3 vidas\u003c/strong>\u003c/span>\u003c/div>\u003cp class=\"welcome-tip\">Cuanto más rápido acertás, más puntos sumás.\u003c/p>\u003cbutton id=\"start\" class=\"primary start\">Empezar a jugar →\u003c/button>\u003cp id=\"welcome-record\" class=\"record\">\u003c/p>\u003cbutton class=\"quiet\" data-help>Ver las reglas\u003c/button>\u003c/section>\n\u003csection id=\"game\" hidden aria-labelledby=\"question\">\u003cdiv class=\"hud\">\u003cdiv>\u003cspan>Puntos\u003c/span>\u003cb id=\"score\">0\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Tiempo\u003c/span>\u003cb id=\"round-time\">60 s\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Vidas\u003c/span>\u003cb id=\"lives\" aria-label=\"3 vidas\">♥ ♥ ♥\u003c/b>\u003c/div>\u003cdiv>\u003cspan>Nivel\u003c/span>\u003cb id=\"level\">1 / 5\u003c/b>\u003c/div>\u003cbutton id=\"pause\" class=\"secondary\" aria-label=\"Pausar partida\">Pausa\u003c/button>\u003c/div>\u003cdiv class=\"play-layout\">\u003carticle class=\"problem\">\u003cdiv class=\"problem-top\">\u003cspan id=\"ticket-label\">SITUACIÓN 01\u003c/span>\u003cspan id=\"combo\" class=\"combo\">×1\u003c/span>\u003c/div>\u003cdiv id=\"art\" class=\"art\">\u003c/div>\u003ch2 id=\"problem-title\">\u003c/h2>\u003cdiv class=\"deadline-copy\">\u003cspan>Tiempo para responder\u003c/span>\u003cstrong id=\"answer-time\">7 s\u003c/strong>\u003c/div>\u003cdiv class=\"deadline\" aria-hidden=\"true\">\u003cspan id=\"deadline-fill\">\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"choices\">\u003ch2 id=\"question\" tabindex=\"-1\">¿Qué tipo de problema es?\u003c/h2>\u003cp class=\"instruction\">Tocá la categoría correcta.\u003c/p>\u003cdiv id=\"options\" class=\"options\">\u003c/div>\u003cp class=\"keyboard-note\">En computadora también podés usar las teclas 1, 2, 3 y 4.\u003c/p>\u003cdiv id=\"feedback\" class=\"feedback\" hidden>\u003cp id=\"message\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\u003cdiv id=\"auto-progress\" class=\"auto-progress\" aria-hidden=\"true\">\u003cspan id=\"advance-fill\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"game-bottom\">\u003cspan id=\"streak-note\">Encadená aciertos para multiplicar tus puntos.\u003c/span>\u003cbutton class=\"quiet\" data-help>Ver reglas\u003c/button>\u003c/div>\u003c/section>\n\u003csection id=\"finish\" class=\"finish\" hidden aria-labelledby=\"finish-title\">\u003cdiv id=\"medal\" class=\"medal\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"eyebrow\">DESAFÍO COMPLETADO\u003c/div>\u003ch1 id=\"finish-title\" tabindex=\"-1\">¡Cada aviso cuenta!\u003c/h1>\u003cp id=\"finish-reason\">\u003c/p>\u003cdiv class=\"summary\">\u003cdiv class=\"score-label\">TU PUNTAJE\u003c/div>\u003cb id=\"final-score\" class=\"big-score\">0\u003c/b>\u003cdiv class=\"result-grid\">\u003cdiv>\u003cb id=\"final-correct\">0\u003c/b>\u003cspan>Aciertos\u003c/span>\u003c/div>\u003cdiv>\u003cb id=\"final-level\">1\u003c/b>\u003cspan>Nivel alcanzado\u003c/span>\u003c/div>\u003cdiv>\u003cb id=\"final-streak\">0\u003c/b>\u003cspan>Mejor racha\u003c/span>\u003c/div>\u003c/div>\u003cp id=\"record-message\" class=\"record\">\u003c/p>\u003c/div>\u003cdiv class=\"finish-actions\">\u003cbutton id=\"again\" class=\"primary\">Superar mi puntaje ↻\u003c/button>\u003cbutton id=\"finish-home\" class=\"secondary\">Volver al inicio\u003c/button>\u003c/div>\u003cp class=\"calm\">Juego de práctica: no envía reportes reales.\u003c/p>\u003c/section>\n\u003c/main>\n\u003cdialog id=\"help\" aria-labelledby=\"help-title\">\u003ch2 id=\"help-title\">Cómo ganar puntos\u003c/h2>\u003cul>\u003cli>Elegí entre Agua, Electricidad, Humedad y Roturas.\u003c/li>\u003cli>Cada acierto suma 100 puntos, más hasta 50 por rapidez.\u003c/li>\u003cli>La racha multiplica: ×2 desde el cuarto acierto seguido y ×3 desde el séptimo.\u003c/li>\u003cli>Cada 4 aciertos subís de nivel. La barra dura de 7 a 3 segundos.\u003c/li>\u003cli>Una respuesta incorrecta o sin tiempo cuesta una vida y corta la racha.\u003c/li>\u003c/ul>\u003cp>Tenés 60 segundos y 3 vidas. Entre imágenes verás el resultado durante 2 segundos. El reloj de la partida sigue corriendo.\u003c/p>\u003cbutton id=\"close-help\" class=\"primary\">Entendido\u003c/button>\u003c/dialog>\u003cdialog id=\"pause-dialog\" aria-labelledby=\"pause-title\">\u003ch2 id=\"pause-title\">Partida en pausa\u003c/h2>\u003cp>Tu tiempo y tus vidas están guardados. Continuá cuando estés listo.\u003c/p>\u003cbutton id=\"resume\" class=\"primary\">Seguir jugando →\u003c/button>\u003cbutton id=\"quit\" class=\"quiet\">Terminar y ver mi puntaje\u003c/button>\u003c/dialog>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst svg=(body,label='')=>`\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 240\" ${label?`role=\"img\" aria-label=\"${label}\"`:'aria-hidden=\"true\"'} fill=\"none\" stroke=\"#274863\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${body}\u003c/svg>`;\nconst drop=(x,y,s=1)=>`\u003cpath transform=\"translate(${x} ${y}) scale(${s})\" d=\"M0-23C-7-12-18 0-18 10a18 18 0 0 0 36 0C18 0 7-12 0-23Z\" fill=\"#68bce6\" stroke=\"#216aa1\" stroke-width=\"3\"/>`;\nconst bulb=svg('\u003cellipse cx=\"160\" cy=\"208\" rx=\"60\" ry=\"8\" fill=\"#d9e5eb\" stroke=\"none\"/>\u003cpath d=\"M133 151c0-24-29-36-29-74a56 56 0 0 1 112 0c0 38-29 50-29 74Z\" fill=\"#ffe2a1\"/>\u003cpath d=\"m162 28-12 35 24 15-24 29 11 26\" stroke=\"#996b32\" stroke-width=\"5\"/>\u003cpath d=\"M134 158h52v23a26 26 0 0 1-52 0Z\" fill=\"#a3b8c9\"/>\u003cpath d=\"M138 167h44m-44 12h44\"/>\u003cpath d=\"m82 40-16-13m172 13 16-13M76 93H54m190 0h22\" stroke=\"#dfa42a\"/>','Un foco con el vidrio agrietado');\nconst faucet=svg('\u003cellipse cx=\"162\" cy=\"216\" rx=\"102\" ry=\"9\" fill=\"#d9e5eb\" stroke=\"none\"/>\u003cpath d=\"M68 185V89h93V65h42v24h20a42 42 0 0 1 42 42v13h-42v-13h-62v54Z\" fill=\"#b6cfdf\"/>\u003cpath d=\"M55 185h122v19H55Z\" fill=\"#8baac0\"/>\u003cpath d=\"M182 64V39m-32 0h64\" stroke-width=\"10\"/>'+drop(243,177,.75),'Una canilla que pierde gotas de agua');\nconst socket=svg('\u003crect x=\"87\" y=\"27\" width=\"146\" height=\"179\" rx=\"18\" fill=\"#fff\"/>\u003ccircle cx=\"160\" cy=\"115\" r=\"47\" fill=\"#dbe7ef\"/>\u003cpath d=\"M145 104v19m30-19v19m-17 14h4\"/>\u003cpath d=\"m200 37-21 29 22 10-18 21\" stroke=\"#bd6849\"/>\u003cpath d=\"m63 83-17-14m209 66 21 9m-53 46 14 17\" stroke=\"#e4a632\"/>','Un enchufe con la tapa rota');\nconst lamp=svg('\u003cpath d=\"M160 19v29\"/>\u003cpath d=\"m114 48-34 77h160l-34-77Z\" fill=\"#88b5d5\"/>\u003cpath d=\"M132 125v19a28 28 0 0 0 56 0v-19\" fill=\"#c0ccd5\"/>\u003cpath d=\"m146 133 26 27m0-27-26 27\" stroke=\"#697c8c\"/>\u003cellipse cx=\"160\" cy=\"210\" rx=\"90\" ry=\"8\" fill=\"#d9e5eb\" stroke=\"none\"/>','Una lámpara apagada');\nconst damp=svg('\u003crect x=\"45\" y=\"28\" width=\"230\" height=\"185\" rx=\"7\" fill=\"#fff4db\"/>\u003cpath d=\"M48 155c13-32 29-9 43-26s21-25 40-12 19-11 40-3 23 35 41 24 33 11 59 30v42H48Z\" fill=\"#91b8ab\" stroke=\"none\"/>\u003cpath d=\"M64 177h17m20-22h18m18 35h25m30-31h19m16 35h18\" stroke=\"#537e73\"/>'+drop(161,69,.75),'Una pared con manchas de humedad');\nconst ceiling=svg('\u003cpath d=\"M40 207V49h240v158\" fill=\"#fff4db\"/>\u003cpath d=\"M40 49h240v32H40Z\" fill=\"#afc9c0\"/>\u003cpath d=\"M94 51c0 31 23 15 23 43s28 19 28-1 20-12 20-42\" fill=\"#80a89b\" stroke=\"none\"/>'+drop(128,130,.7)+drop(128,178,.5)+'\u003cpath d=\"M205 148h43v59h-43Zm-27 59h90\" fill=\"#bfd6e5\"/>','Un techo con humedad y gotas');\nconst door=svg('\u003cpath d=\"M74 210V26h172v184\" fill=\"#c4d9e7\"/>\u003cpath d=\"M94 210V44h128v166\" fill=\"#e9bd8f\"/>\u003cpath d=\"m128 67 20 35-19 26 26 19-11 28\" stroke=\"#996036\"/>\u003ccircle cx=\"194\" cy=\"128\" r=\"7\" fill=\"#446782\"/>\u003cpath d=\"M54 213h212\"/>','Una puerta de madera agrietada');\nconst windowArt=svg('\u003crect x=\"63\" y=\"29\" width=\"194\" height=\"179\" rx=\"5\" fill=\"#fff\"/>\u003cpath d=\"M78 44h164v149H78Z\" fill=\"#bde2f1\"/>\u003cpath d=\"M160 44v149M78 118h164\" stroke=\"#688ca6\"/>\u003cpath d=\"m219 64-31 23 17 28-28 26 19 27m-8-81-13-17m30 45 25 7\" stroke=\"#416886\"/>\u003cpath d=\"M51 209h218\"/>','Una ventana con el vidrio quebrado');\nconst cats=[{id:'agua',name:'Agua',tone:'#1765a1',tint:'#e5f3ff',icon:'\u003cpath d=\"M24 5C18 15 10 23 10 31a14 14 0 0 0 28 0C38 23 30 15 24 5Z\" fill=\"currentColor\"/>'},{id:'electricidad',name:'Electricidad',tone:'#956100',tint:'#fff1ca',icon:'\u003cpath d=\"m27 3-17 25h12l-3 17 19-27H26Z\" fill=\"currentColor\"/>'},{id:'humedad',name:'Humedad',tone:'#26765c',tint:'#e5f3ed',icon:'\u003cpath d=\"M24 5C18 15 10 23 10 31a14 14 0 0 0 28 0C38 23 30 15 24 5Z\" fill=\"currentColor\"/>\u003cpath d=\"M23 35h9M19 29h12\" stroke=\"white\" stroke-width=\"3\"/>'},{id:'roturas',name:'Roturas',tone:'#b54935',tint:'#fdece6',icon:'\u003cpath d=\"M31 6a11 11 0 0 0-14 14L6 32a6 6 0 0 0 9 9l12-13a11 11 0 0 0 15-13l-9 8-7-7Z\" fill=\"currentColor\"/>'}];\nconst items=[{title:'Foco roto',cat:'electricidad',art:bulb,hint:'El foco sirve para dar luz.',why:'Los focos y las luces van en Electricidad.'},{title:'Canilla rota',cat:'agua',art:faucet,hint:'Mirá las gotas que salen de la canilla.',why:'Una canilla que pierde agua va en Agua.'},{title:'Enchufe roto',cat:'electricidad',art:socket,hint:'El enchufe conecta los aparatos a la electricidad.',why:'Los enchufes van en Electricidad. No los toques si están rotos.'},{title:'Luz apagada',cat:'electricidad',art:lamp,hint:'Esta lámpara debería dar luz.',why:'Una luz que no funciona va en Electricidad.'},{title:'Pared húmeda',cat:'humedad',art:damp,hint:'La pared tiene una mancha de humedad.',why:'Las manchas de humedad van en Humedad.'},{title:'Techo húmedo',cat:'humedad',art:ceiling,hint:'El techo tiene una mancha húmeda y gotas.',why:'Un techo con humedad va en Humedad.'},{title:'Puerta rota',cat:'roturas',art:door,hint:'La madera de la puerta está quebrada.',why:'Las puertas dañadas van en Roturas.'},{title:'Vidrio roto',cat:'roturas',art:windowArt,hint:'Mirá la grieta en el vidrio de la ventana.',why:'Los vidrios quebrados van en Roturas.'}];\n// Dos ejemplos de agua: se sustituye una luz por un caño para equilibrar las categorías.\nitems[3]={title:'Caño con pérdida',cat:'agua',art:svg('\u003cpath d=\"M43 54h120v55h109v57H136a30 30 0 0 1-30-30v-25H43Z\" fill=\"#afc8da\"/>\u003cpath d=\"M61 48v68m188-13v68\"/>\u003cpath d=\"m193 111-12 19 17 9-11 22\" stroke=\"#4a718d\"/>'+drop(189,196,.65),'Un caño agrietado que pierde agua'),hint:'Del caño están cayendo gotas de agua.',why:'Los caños que pierden agua van en Agua.'};\n$('example-art').innerHTML=bulb;\n$('medal').innerHTML=svg('\u003cpath d=\"m105 130-15 84 70-28 70 28-15-84\" fill=\"#bdd9ef\"/>\u003ccircle cx=\"160\" cy=\"92\" r=\"76\" fill=\"#ffe5a0\" stroke=\"#b58931\"/>\u003ccircle cx=\"160\" cy=\"92\" r=\"57\" stroke=\"#d0a248\"/>\u003cpath d=\"m127 92 23 23 47-50\" stroke=\"#317453\" stroke-width=\"13\"/>');\nfunction categoryIcon(c){return `\u003cspan class=\"icon\">\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\">${c.icon}\u003c/svg>\u003c/span>`}\nfunction categoryColors(c){return `--tone:${c.tone};--tint:${c.tint}`}\n$('options').innerHTML=cats.map((c,i)=>`\u003cbutton class=\"option\" data-cat=\"${c.id}\" style=\"${categoryColors(c)}\">${categoryIcon(c)}${c.name}\u003csmall class=\"key\">${i+1}\u003c/small>\u003c/button>`).join('');\n$('welcome-categories').innerHTML=cats.map(c=>`\u003cdiv class=\"welcome-category ${c.id==='electricidad'?'example-selected':''}\" style=\"${categoryColors(c)}\">${categoryIcon(c)}\u003cspan>${c.name}\u003c/span>\u003c/div>`).join('');\n// Rounds use a monotonic clock; hiding the page or opening rules pauses both clocks.\nconst ROUND_MS=60000,FEEDBACK_MS=2000,LEVEL_MS=[7000,6000,5000,4000,3000];\nitems.push({title:'Baldosa rota',cat:'roturas',art:svg('\u003cpath d=\"M39 190 97 51h135l51 139Z\" fill=\"#ead8bd\"/>\u003cpath d=\"M73 110h181m-35-59 28 139M138 51l-16 139\" stroke=\"#b09a7e\"/>\u003cpath d=\"m173 66-19 39 24 22-20 43\" stroke=\"#745745\"/>','Una baldosa agrietada'),why:'Las baldosas quebradas van en Roturas.'},{title:'Interruptor roto',cat:'electricidad',art:svg('\u003crect x=\"90\" y=\"25\" width=\"140\" height=\"188\" rx=\"16\" fill=\"#fff\"/>\u003cpath d=\"M125 68h70v101h-70Z\" fill=\"#bdd3e1\"/>\u003cpath d=\"m141 73 25 27-21 24 28 31\" stroke=\"#b54935\"/>','Un interruptor con la tecla agrietada'),why:'Los interruptores van en Electricidad.'},{title:'Tanque con pérdida',cat:'agua',art:svg('\u003cpath d=\"M76 55h168v114a84 35 0 0 1-168 0Z\" fill=\"#bbd3e4\"/>\u003cellipse cx=\"160\" cy=\"55\" rx=\"84\" ry=\"29\" fill=\"#d6e5ef\"/>\u003cpath d=\"M87 177v36m145-36v36m-128-100h31m50 0h31\"/>'+drop(238,195,.6),'Un tanque que pierde agua'),why:'Los tanques con pérdidas van en Agua.'},{title:'Mancha de humedad',cat:'humedad',art:svg('\u003crect x=\"46\" y=\"27\" width=\"228\" height=\"186\" rx=\"8\" fill=\"#fff4db\"/>\u003cpath d=\"M129 80c-41-29-75 20-45 53-20 39 35 62 57 35 35 28 66-7 47-36 29-48-25-66-59-52Z\" fill=\"#90b4a3\" stroke=\"none\"/>\u003cpath d=\"M103 111h12m24 36h19m-51 9h10m36-59h14\" stroke=\"#52796b\"/>','Una mancha de humedad en una pared'),why:'Las manchas en paredes van en Humedad.'});\nconst buttons=[...document.querySelectorAll('.option')];\nlet bag=[],previous=null,current=null,playing=false,paused=false,phase='idle',remaining=ROUND_MS,phaseRemaining=0,answerLimit=0,score=0,lives=3,correct=0,attempts=0,streak=0,bestStreak=0,level=1,sequence=0,lastTime=0,frameId=null,helpOpener=null,helpResume=false,record=loadRecord();\nfunction loadRecord(){try{return Math.max(0,Number(localStorage.getItem('sired_challenge_best_v1'))||0)}catch{return 0}}\nfunction updateRecordLabel(){$('welcome-record').textContent=record>0?`Récord en este dispositivo: ${record.toLocaleString('es-UY')} puntos`:'Intentá conseguir tu mejor puntaje.'}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction nextItem(){if(!bag.length){bag=shuffle(items.slice());if(bag[bag.length-1]===previous){[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]}}current=bag.pop();previous=current;sequence++;phase='answer';answerLimit=LEVEL_MS[level-1];phaseRemaining=answerLimit;$('art').innerHTML=current.art;$('problem-title').textContent=current.title;$('ticket-label').textContent=`SITUACIÓN ${String(sequence).padStart(2,'0')}`;$('feedback').hidden=true;$('feedback').className='feedback';$('message').textContent='';$('advance-fill').style.transform='scaleX(0)';buttons.forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong')});updateHud();updateBars()}\nfunction showScreen(id){['welcome','game','finish'].forEach(s=>$(s).hidden=s!==id)}\nfunction start(){cancelAnimationFrame(frameId);playing=true;paused=false;phase='answer';remaining=ROUND_MS;score=0;lives=3;correct=0;attempts=0;streak=0;bestStreak=0;level=1;sequence=0;previous=null;bag=[];showScreen('game');nextItem();lastTime=performance.now();frameId=requestAnimationFrame(loop);$('question').focus()}\nfunction updateHud(){$('score').textContent=score.toLocaleString('es-UY');$('round-time').textContent=Math.ceil(Math.max(0,remaining)/1000)+' s';$('lives').textContent=Array.from({length:3},(_,i)=>i\u003clives?'♥':'♡').join(' ');$('lives').setAttribute('aria-label',`${lives} vidas`);$('level').textContent=level+' / 5';const mult=Math.min(3,1+Math.floor(Math.max(0,streak-1)/3));$('combo').textContent='×'+mult;$('streak-note').textContent=streak?`${streak} aciertos seguidos · multiplicador ×${mult}`:'Encadená aciertos para multiplicar tus puntos.'}\nfunction updateBars(){const fraction=phase==='answer'?Math.max(0,phaseRemaining/answerLimit):0;$('deadline-fill').style.transform=`scaleX(${fraction})`;$('deadline-fill').parentElement.classList.toggle('urgent',fraction\u003c.3&&phase==='answer');$('answer-time').textContent=phase==='answer'?(Math.max(0,phaseRemaining)/1000).toFixed(1)+' s':'—';if(phase==='feedback')$('advance-fill').style.transform=`scaleX(${Math.min(1,1-phaseRemaining/FEEDBACK_MS)})`}\nfunction message(title,text,success){$('feedback').hidden=false;$('feedback').className='feedback '+(success?'success':'error');$('message').replaceChildren();const strong=document.createElement('strong');strong.textContent=title;$('message').append(strong,document.createTextNode(text))}\nfunction settle(isCorrect,button,timedOut=false){if(!playing||paused||phase!=='answer')return;attempts++;buttons.forEach(b=>b.disabled=true);if(isCorrect){streak++;correct++;bestStreak=Math.max(bestStreak,streak);const mult=Math.min(3,1+Math.floor((streak-1)/3)),bonus=Math.round(50*Math.max(0,phaseRemaining/answerLimit)),points=(100+bonus)*mult;score+=points;button?.classList.add('correct');const oldLevel=level;level=Math.min(5,1+Math.floor(correct/4));message(`¡Muy bien! +${points} puntos`,level>oldLevel?`Nivel ${level}: ¡ahora más rápido!`:streak>=4?`Racha de ${streak} · ×${mult}`:current.why,true)}else{lives--;streak=0;button?.classList.add('wrong');buttons.find(b=>b.dataset.cat===current.cat)?.classList.add('correct');const category=cats.find(c=>c.id===current.cat).name;message(timedOut?'¡Se terminó el tiempo!':'Esta vez no.',`Era ${category}. ${lives?`Te quedan ${lives} ${lives===1?'vida':'vidas'}.`:'Terminó la partida.'}`,false)}phase='feedback';phaseRemaining=FEEDBACK_MS;updateHud();updateBars()}\nfunction updateTime(now){if(!playing||paused)return;const dt=Math.max(0,now-lastTime);lastTime=now;remaining=Math.max(0,remaining-dt);phaseRemaining-=dt;if(remaining\u003c=0){endGame('¡Se cumplió el minuto!');return}if(phaseRemaining\u003c=0){if(phase==='answer')settle(false,null,true);else if(phase==='feedback'){if(lives\u003c=0)endGame('Te quedaste sin vidas. ¡Probá otra vez!');else nextItem()}}if(playing){updateHud();updateBars()}}\nfunction loop(now){updateTime(now);if(playing&&!paused)frameId=requestAnimationFrame(loop)}\nfunction choose(button){if(!playing||paused||phase!=='answer')return;const old=current;updateTime(performance.now());if(!playing||paused||phase!=='answer'||old!==current)return;settle(button.dataset.cat===current.cat,button)}\nfunction freeze(){if(!playing||paused)return false;updateTime(performance.now());if(!playing)return false;paused=true;cancelAnimationFrame(frameId);return true}\nfunction resume(){if(!playing||!paused)return;paused=false;lastTime=performance.now();frameId=requestAnimationFrame(loop)}\nfunction openPause(){if(freeze())$('pause-dialog').showModal()}\nfunction endGame(reason){if(!playing)return;playing=false;paused=false;phase='idle';cancelAnimationFrame(frameId);const oldRecord=record;if(score>record){record=score;try{localStorage.setItem('sired_challenge_best_v1',String(record))}catch{}}$('final-score').textContent=score.toLocaleString('es-UY');$('final-correct').textContent=correct;$('final-level').textContent=level;$('final-streak').textContent=bestStreak;$('finish-reason').textContent=reason;$('record-message').textContent=score>oldRecord?'¡Nuevo récord en este dispositivo!':`Récord en este dispositivo: ${record.toLocaleString('es-UY')} puntos`;updateRecordLabel();showScreen('finish');$('finish-title').focus()}\nbuttons.forEach(b=>b.addEventListener('click',()=>choose(b)));\n$('start').addEventListener('click',start);$('again').addEventListener('click',start);$('finish-home').addEventListener('click',()=>{showScreen('welcome');$('start').focus()});\n$('pause').addEventListener('click',openPause);$('resume').addEventListener('click',()=>$('pause-dialog').close());$('pause-dialog').addEventListener('close',()=>{resume();if(playing)$('question').focus()});$('quit').addEventListener('click',()=>{endGame('Partida finalizada. ¡Gracias por jugar!');$('pause-dialog').close()});\ndocument.querySelectorAll('[data-help]').forEach(b=>b.addEventListener('click',()=>{helpOpener=b;helpResume=freeze();$('help').showModal()}));$('close-help').addEventListener('click',()=>$('help').close());$('help').addEventListener('close',()=>{if(helpResume)resume();helpResume=false;helpOpener?.focus()});\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)openPause()});window.addEventListener('blur',()=>{if(playing&&!paused)openPause()});\ndocument.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;if(e.key==='Escape'&&playing&&!paused){e.preventDefault();openPause();return}const i=Number(e.key)-1;if(['1','2','3','4'].includes(e.key)&&playing&&!paused){e.preventDefault();choose(buttons[i])}});\nupdateRecordLabel();\n\n\u003c/script>\n\u003cscript>\n(function(){\nlet pending=false;\nfunction resize(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;parent.postMessage({type:'game-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*')})}\nnew ResizeObserver(resize).observe(document.body);\nwindow.addEventListener('load',resize);\nresize();\n})();\n\u003c/script>\u003c/body>\n\u003c/html>\n"}</script>
<script>
'use strict';
const sources=JSON.parse(document.getElementById('game-sources').textContent);
const container=document.getElementById('game-container');
const descriptions={easy:'Sin reloj ni vidas · 8 imágenes · Con pistas y lectura en voz alta',hard:'60 segundos · 3 vidas · Puntaje, rachas y 5 niveles'};
let activeMode=null,gameFrame=null;
function setMode(mode){
 if(mode===activeMode)return;
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
 // Removing the old document also stops its timers and animation loops.
 container.replaceChildren();
 activeMode=mode;
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 document.getElementById('mode-description').textContent=descriptions[mode];
 gameFrame=document.createElement('iframe');
 gameFrame.title='Edificios sin problemas · Modo '+(mode==='easy'?'fácil':'difícil');
 gameFrame.srcdoc=sources[mode];
 container.append(gameFrame);
}
window.addEventListener('message',event=>{
 if(!gameFrame||event.source!==gameFrame.contentWindow||!event.data||event.data.type!=='game-height')return;
 const height=event.data.height;
 if(Number.isFinite(height)&&height>0&&height<20000)gameFrame.style.height=(height+8)+'px';
});
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));
setMode('easy');
</script></body></html>
